# Workspace: dos aplicaciones que comparten la lógica numérica.
#   graficos/  FisGraf: gráficos de datos con ajustes y LaTeX (biblioteca `fisgraf`
#              y herramienta de línea de comandos `fisgraf-cli`).
#   errores/   FisErr: calculadora de propagación de errores.
[workspace]
members = ["graficos", "errores"]
resolver = "3"
