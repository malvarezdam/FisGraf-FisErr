[package]
name = "fiserr"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
description = "FisErr: calculadora de propagación de errores (misma lógica que FisGraf)"

[[bin]]
name = "fiserr"
path = "src/main.rs"

[dependencies]
fisgraf = { path = "../graficos" }
anyhow = "1.0.104"
eframe = "0.37.0"
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
egui_kittest = "0.37"
