[package]
name = "fisgraf"
version = "0.1.0"
edition = "2024"
default-run = "fisgraf"

[dependencies]
anyhow = "1.0.104"
calamine = "0.37.0"
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = "0.37.0"
egui_plot = "0.38.0"
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
nalgebra = "0.35.0"
rand = "0.10.3"
rand_distr = "0.6.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
statrs = "0.19.1"
thiserror = "2.0.21"

[dev-dependencies]
egui_kittest = "0.37"
rust_xlsxwriter = "0.101.0"

[build-dependencies]
winresource = "0.1.34"
